name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: diario_alerr
          POSTGRES_USER: diario_alerr
          POSTGRES_PASSWORD: diario_alerr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diario_alerr -d diario_alerr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://diario_alerr:diario_alerr@localhost:5432/diario_alerr?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
          cache: false

      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install the conformance command
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/ItzTas/monitor-hub/sdk/cmd/plugin-conformance@v0.2.1
          echo "PLUGIN_CONFORMANCE=$RUNNER_TEMP/bin/plugin-conformance" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2.9.3

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --locked

  image:
    name: Build and publish the image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,priority=300

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

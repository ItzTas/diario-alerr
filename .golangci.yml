version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - noctx
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - gosec
      - path: diario\.go
        text: G204
        linters:
          - gosec
      - path: state\.go
        text: G304
        linters:
          - gosec

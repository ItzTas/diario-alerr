version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - noctx
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
  exclusions:
    rules:
      - path: (_test\.go$|[a-z]+test/)
        linters:
          - gosec
      - path: internal/gazette/pdf\.go
        text: G204
        linters:
          - gosec
      - path: internal/watch/statefile\.go
        text: G304
        linters:
          - gosec
    paths:
      - internal/db

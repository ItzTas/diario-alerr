services:
  postgres:
    image: postgres:18-alpine
    cpus: "0.5"
    mem_limit: 256m
    container_name: diario-alerr-dev-postgres
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: diario_alerr
      POSTGRES_USER: diario_alerr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - diario-dev-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diario_alerr -d diario_alerr"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  diario-dev-postgres:
